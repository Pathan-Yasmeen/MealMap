<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MealMap - Find recipes you'll actually cook.">
    <title>MealMap</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <a href="#discover">MealMap</a>
        <nav>
            <a href="#discover">Discover</a>
            <a href="#favourites">Favourites</a>
            <a href="#planner">Planner</a>
            <a href="#shopping">Shopping</a>
        </nav>
        <button id="theme-button" type="button">Dark Mode</button>
    </header>
    <main>
        <section id="discover-view">
            <h1>Discover Recipes</h1>
            <form class="recipe-search">
                <div class="search-field">
                <label for="recipe-search">Search Recipes</label>
                <input type="search" id="recipe-search" placeholder="Search Your Recipes Here...">
                </div>
                <div class="search-field">
                <label for="recipe-category">Category</label>
                <select id="recipe-category">
                    <option value="">All Categories</option>
                </select> 
                </div>
                <div class="search-field">
                <label for="recipe-cuisine">Cuisine</label>
                <select id="recipe-cuisine">
                    <option value="">All Cuisines</option>
                </select>
                </div>
            </form>
            <div class="recipe-grid" id="recipe-grid"></div>

        </section>

        <section id="recipe-view">
        </section>

        <section id="favourites-view">
                <h1>Favourite Recipes</h1>
                <div class="recipe-grid" id="favourites-grid"></div>
        </section>

        <section id="planner-view">
    <div class="planner-head">
        <div>
            <h1>Weekly Planner</h1>
            <p>
                Planned meals:
                <span id="plan-count">0</span>
            </p>
        </div>

        <button
            type="button"
            id="clear-btn"
        >
            Clear Week
        </button>
    </div>

    <div class="planner-box">
        <table class="planner-table">
            <thead>
                <tr>
                    <th scope="col">Day</th>
                    <th scope="col">Breakfast</th>
                    <th scope="col">Lunch</th>
                    <th scope="col">Dinner</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <th scope="row">Monday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="mon-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="mon-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="mon-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>

                <tr>
                    <th scope="row">Tuesday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="tue-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="tue-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="tue-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>

                <tr>
                    <th scope="row">Wednesday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="wed-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="wed-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="wed-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>

                <tr>
                    <th scope="row">Thursday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="thu-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="thu-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="thu-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>

                <tr>
                    <th scope="row">Friday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="fri-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="fri-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="fri-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>

                <tr>
                    <th scope="row">Saturday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="sat-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="sat-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="sat-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>

                <tr>
                    <th scope="row">Sunday</th>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="sun-breakfast"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="sun-lunch"
                        >
                            +
                        </button>
                    </td>
                    <td>
                        <button
                            type="button"
                            class="slot"
                            data-slot="sun-dinner"
                        >
                            +
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

        <section id="shopping-view">
        </section>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
